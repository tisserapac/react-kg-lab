[project]
name = "react-kg-lab"
version = "0.1.0"
description = "Lab for the lecture Knowledge Graphs for React Code Generation: few-shot extraction, Memgraph, and task context from a knowledge graph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8,<3",
    "openai>=3.35,<4",
    "neo4j>=6.4,<7",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0,<7",
]

[tool.uv]
package = false
